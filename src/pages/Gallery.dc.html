<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyber Fitness — Gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Aileron';font-weight:400;src:url(/_blob/ac6100a496d7e0e32d666465c2759312) format('woff2')}
@font-face{font-family:'Aileron';font-weight:600;src:url(/_blob/f0a3b54c6c0490c7808f910f656adcd3) format('woff2')}
@font-face{font-family:'Aileron';font-weight:700;src:url(/_blob/1a6eabb20935006830858b9ab22d7603) format('woff2')}
@font-face{font-family:'Aileron';font-weight:800;src:url(/_blob/05347dd3a3a98f133849cfc2ffb7889d) format('woff2')}
@font-face{font-family:'Archivo';font-style:italic;font-weight:100 900;font-stretch:62% 125%;src:url(/_blob/856990c91645be07e259db49d0475b43) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;src:url(/_blob/bd798f073e227f7c230f5c83deee1174) format('woff2')}
</style>
<style>
body{margin:0;background:#FFF7F0;color:#1C0A1B;font-family:'Aileron',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#ED3159;text-decoration:none}a:hover{color:#480E43}
h1,h2{font-family:'Archivo',system-ui,sans-serif;font-stretch:125%;font-style:italic;text-transform:uppercase;margin:0}h3{font-family:'Aileron',system-ui,sans-serif;margin:0}
p{margin:0}
img{display:block}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 100%; min-width: 0; background: #FFF7F0; overflow: hidden;">
<dc-import name="Nav" active="none" hint-size="100%,77px"></dc-import>

<section style="max-width: 1280px; margin: 0 auto; padding: 72px 32px 104px; display: flex; flex-direction: column; gap: 40px;">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px;">
    <div style="display: flex; flex-direction: column; gap: 20px; max-width: 760px;">
      <p style="font-size: 14px; color: #6B5A69;"><a href="Main.dc.html" style="color: #6B5A69;">Home</a> / Gallery</p>
      <h1 style="font-size: clamp(36px, 4.2vw, 60px); line-height: 1.02; letter-spacing: -0.01em; font-weight: 800;">Moments from <span style="color: #ED3159;">the community.</span></h1>
    </div>
    <p style="font-size: 18px; line-height: 1.6; color: #5E4D5C; max-width: 420px;">Training days, conferences, press appearances and the people who make Cyber Fitness what it is.</p>
  </div>

  <div role="group" aria-label="Filter gallery" style="display: flex; flex-wrap: wrap; gap: 10px;">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
      <sc-if value="{{f.on}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-pressed="true" onClick="{{f.pick}}" style="border: 0; padding: 12px 20px; border-radius: 999px; background: #ED3159; color: #FFFFFF; font-size: 15px; font-weight: 800;">{{f.label}}</button>
      </sc-if>
      <sc-if value="{{f.off}}" hint-placeholder-val="{{true}}">
        <button type="button" aria-pressed="false" onClick="{{f.pick}}" style="border: 1.5px solid #EBCDD8; padding: 11px 19px; border-radius: 999px; background: #FFFFFF; color: #1C0A1B; font-size: 15px; font-weight: 700;">{{f.label}}</button>
      </sc-if>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
        <sc-if value="{{it.hasImg}}" hint-placeholder-val="{{true}}">
          <div style="aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; background: #F6DCE4;"><img src="{{it.src}}" alt="{{it.caption}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{it.pos}};"></div>
        </sc-if>
        <sc-if value="{{it.noImg}}" hint-placeholder-val="{{false}}">
          <div style="aspect-ratio: 4 / 3; border-radius: 22px; background: #FAD0DC; border: 2px dashed #E8C3D0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #6B5A69; text-align: center; padding: 20px; box-sizing: border-box;">
            <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-7 7"></path></svg>
            <span style="font-size: 14px; font-weight: 700;">[Add {{it.caption}} photo]</span>
          </div>
        </sc-if>
        <figcaption style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px;"><span style="font-weight: 700;">{{it.caption}}</span><span style="color: #6B5A69;">{{it.catLabel}}</span></figcaption>
      </figure>
    </sc-for>
  </div>
</section>

<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all' };
  }
  renderVals() {
    const cats = [
      ['all', 'All'], ['training', 'Training days'], ['team', 'Team'],
      ['malaysia', 'Malaysia conference'], ['pressclub', 'Press Club'], ['media', 'Media'], ['clients', 'Clients']
    ];
    const label = Object.fromEntries(cats);
    const all = [
      { cat: 'training', caption: 'Team training day', src: '/_blob/8a1fb04ecba5b19b81cb0d1d17fe75aa', pos: 'center 40%' },
      { cat: 'training', caption: 'Partner plank drill', src: '/_blob/2b920c4d3782a2426675ed7be20d60f7', pos: 'center' },
      { cat: 'training', caption: 'Coaching outdoors', src: '/_blob/be564a6f07e864156b4ed152fe793bb1', pos: 'center' },
      { cat: 'team', caption: 'Hijab Wasif', src: '/_blob/cbffee1cc9b5bf1cb014ad594595657e', pos: 'center 25%' },
      { cat: 'team', caption: 'Efra Shaikh', src: '/_blob/177bc6cd012b84370d01f84c6e8637b3', pos: 'center 20%' },
      { cat: 'team', caption: 'Hussain Fareed', src: '/_blob/4bb3c784a9ecf77dea55f107ae4ee9e3', pos: 'center 20%' },
      { cat: 'malaysia', caption: 'Malaysia conference' },
      { cat: 'malaysia', caption: 'Malaysia conference' },
      { cat: 'pressclub', caption: 'Press Club' },
      { cat: 'media', caption: 'TV appearance' },
      { cat: 'clients', caption: 'Client session' },
      { cat: 'clients', caption: 'Client session' }
    ];
    const cat = this.state.cat;
    const items = all.filter((x) => cat === 'all' || x.cat === cat).map((x) => ({
      ...x, hasImg: !!x.src, noImg: !x.src, pos: x.pos || 'center', catLabel: label[x.cat]
    }));
    const filters = cats.map(([key, text]) => ({
      label: text, on: key === cat, off: key !== cat, pick: () => this.setState({ cat: key })
    }));
    return { filters, items };
  }
}
</script>
</body>
</html>
