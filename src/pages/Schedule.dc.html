<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyber Fitness — Live class schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Aileron';font-weight:400;src:url(/_blob/ac6100a496d7e0e32d666465c2759312) format('woff2')}
@font-face{font-family:'Aileron';font-weight:600;src:url(/_blob/f0a3b54c6c0490c7808f910f656adcd3) format('woff2')}
@font-face{font-family:'Aileron';font-weight:700;src:url(/_blob/1a6eabb20935006830858b9ab22d7603) format('woff2')}
@font-face{font-family:'Aileron';font-weight:800;src:url(/_blob/05347dd3a3a98f133849cfc2ffb7889d) format('woff2')}
@font-face{font-family:'Archivo';font-style:italic;font-weight:100 900;font-stretch:62% 125%;src:url(/_blob/856990c91645be07e259db49d0475b43) format('woff2')}
</style>
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; font-family: 'Aileron', system-ui, sans-serif; color: #1C0A1B; background: #FFFFFF; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 22px;">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5A69;">Show times for</span>
      <div role="group" aria-label="Time zone" style="display: flex; flex-wrap: wrap; gap: 6px;">
        <sc-for list="{{zones}}" as="z" hint-placeholder-count="6">
          <sc-if value="{{z.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{z.pick}}" style="min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid #480E43; background: #480E43; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;">{{z.label}}</button>
          </sc-if>
          <sc-if value="{{z.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{z.pick}}" style="min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid #E8C3D0; background: #FFFFFF; color: #1C0A1B; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">{{z.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5A69;">Day</span>
      <div role="group" aria-label="Day" style="display: flex; gap: 6px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
          <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{d.pick}}" style="min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid #ED3159; background: #ED3159; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;">{{d.label}}</button>
          </sc-if>
          <sc-if value="{{d.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{d.pick}}" style="min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid #E8C3D0; background: #FFFFFF; color: #1C0A1B; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">{{d.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 18px; background: #FBE836; color: #480E43; font-size: 15px; font-weight: 700; line-height: 1.4;">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    No fixed batches. Join any class, any day, and switch times whenever your week changes.
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: grid; grid-template-columns: 130px minmax(0, 1fr) 150px; gap: 16px; padding: 0 18px 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #6B5A69;">
      <span>{{zoneLabel}} time</span><span>Class &amp; coach</span><span>Days</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
      <div style="display: grid; grid-template-columns: 130px minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 14px 18px; border-radius: 16px; background: {{r.bg}};">
        <span style="font-family: 'Archivo', sans-serif; font-stretch: 112%; font-style: italic; font-size: 20px; font-weight: 800; color: #480E43; white-space: nowrap;">{{r.time}}</span>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <span style="font-size: 16px; font-weight: 800;">{{r.cls}}</span>
          <span style="font-size: 14px; color: #5E4D5C;">with {{r.coach}}</span>
        </div>
        <span style="justify-self: start; padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #F0D6DF; font-size: 13px; font-weight: 700; color: #480E43; white-space: nowrap;">{{r.days}}</span>
      </div>
    </sc-for>
  </div>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6B5A69;">{{count}} live classes listed. Times can change month to month; your coach confirms your slot on WhatsApp.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"zone":{"editor":"enum","options":["pk","in","ksa","uae","uk","cet"],"default":"pk"},"$preview":{"width":1100,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { zone: null, day: 'all' };
  }
  renderVals() {
    const zoneKeys = ['pk', 'in', 'ksa', 'uae', 'uk', 'cet'];
    const zoneNames = { pk: 'Pakistan', in: 'India', ksa: 'KSA', uae: 'UAE', uk: 'UK', cet: 'Europe (CET)' };
    const zone = this.state.zone ?? this.props.zone ?? 'pk';
    const zi = Math.max(0, zoneKeys.indexOf(zone));
    const dayNames = { wk: 'Mon – Fri', mth: 'Mon – Thu', sun: 'Sunday only', sth: 'Sun – Thu' };
    const data = [
      ['Strength Training', 'Qafiya Ghouri', 'wk', ['7:30 AM', '8:00 AM', '5:30 AM', '6:30 AM', '2:30 AM', '3:30 AM']],
      ['HIIT Workout', 'Afshan Khan', 'wk', ['8:30 AM', '9:00 AM', '6:30 AM', '7:30 AM', '3:30 AM', '4:30 AM']],
      ['Circuit Training', 'Efra Shaikh', 'wk', ['10:30 AM', '11:00 AM', '8:30 AM', '9:30 AM', '5:30 AM', '6:30 AM']],
      ['Yoga', 'Faiza Shehzad', 'mth', ['11:30 AM', '12:00 PM', '9:30 AM', '10:30 AM', '6:30 AM', '7:30 AM']],
      ['Sunday Yoga', 'Faiza Shehzad', 'sun', ['12:00 PM', '12:30 PM', '10:00 AM', '11:00 AM', '8:00 AM', '9:00 AM']],
      ['Strength & Conditioning', 'Hijab Wasif', 'wk', ['12:45 PM', '1:15 PM', '10:45 AM', '11:45 AM', '8:45 AM', '9:45 AM']],
      ['Strength Training', 'Madiha Mateen', 'wk', ['2:00 PM', '2:30 PM', '12:00 PM', '1:00 PM', '10:00 AM', '11:00 AM']],
      ['HIIT Workout', 'Rabbia Shaikh', 'wk', ['3:00 PM', '3:30 PM', '1:00 PM', '2:00 PM', '11:00 AM', '12:00 PM']],
      ['Circuit Training', 'Efra Shaikh', 'wk', ['4:00 PM', '4:30 PM', '2:00 PM', '3:00 PM', '12:00 PM', '1:00 PM']],
      ['Diastasis Recti & Pelvic Floor', 'Faiza Shehzad', 'mth', ['5:00 PM', '5:30 PM', '3:00 PM', '4:00 PM', '1:00 PM', '2:00 PM']],
      ['Yoga', 'Faiza Shehzad', 'sth', ['6:00 PM', '6:30 PM', '4:00 PM', '5:00 PM', '2:00 PM', '3:00 PM']],
      ['CO Session', 'Moiz Mateen', 'wk', ['7:15 PM', '7:45 PM', '5:15 PM', '6:15 PM', '3:15 PM', '4:15 PM']],
      ['Beginner / Knee-friendly Workout', 'Madiha Mateen', 'wk', ['8:00 PM', '8:30 PM', '6:00 PM', '7:00 PM', '4:00 PM', '5:00 PM']],
      ['Zumba', 'Afshan Khan', 'wk', ['9:00 PM', '9:30 PM', '7:00 PM', '8:00 PM', '5:00 PM', '6:00 PM']],
      ['Strength & Conditioning', 'Hijab Wasif', 'wk', ['9:45 PM', '10:15 PM', '7:45 PM', '8:45 PM', '5:45 PM', '6:45 PM']],
      ['CO Session', 'Hussain Fareed', 'wk', ['10:30 PM', '11:00 PM', '8:30 PM', '9:30 PM', '6:30 PM', '7:30 PM']],
      ['CO Session', 'Moiz Mateen', 'wk', ['11:15 PM', '11:45 PM', '9:15 PM', '10:15 PM', '7:15 PM', '8:15 PM']],
      ['Strength Training', 'Qafiya Ghouri', 'wk', ['12:15 AM', '12:45 AM', '10:15 PM', '11:15 PM', '8:15 PM', '9:15 PM']]
    ];
    const show = {
      all: () => true,
      week: (d) => d !== 'sun',
      sun: (d) => d === 'sun' || d === 'sth'
    };
    const day = this.state.day;
    const rows = data
      .filter(([, , d]) => show[day](d))
      .map(([cls, coach, d, times], i) => ({
        cls, coach, days: dayNames[d], time: times[zi],
        bg: cls.indexOf('Diastasis') === 0 || cls.indexOf('Beginner') === 0 ? '#FFF3B8' : (i % 2 ? '#FFFFFF' : '#FFF7F0')
      }));
    return {
      zoneLabel: zoneNames[zoneKeys[zi]],
      zones: zoneKeys.map((k) => ({ label: zoneNames[k], on: k === zoneKeys[zi], off: k !== zoneKeys[zi], pick: () => this.setState({ zone: k }) })),
      days: [['all', 'All days'], ['week', 'Weekdays'], ['sun', 'Sunday']].map(([k, label]) => ({ label, on: k === day, off: k !== day, pick: () => this.setState({ day: k }) })),
      rows,
      count: rows.length
    };
  }
}
</script>
</body>
</html>
