  renderVals() {
    const active = this.props.active ?? 'home';
    const items = [
      ['home', 'Home', 'Main.dc.html'],
      ['about', 'About', 'About.dc.html'],
      ['classes', 'Live classes', 'Classes.dc.html'],
      ['programs', 'Programmes', 'Programs.dc.html'],
      ['trainers', 'Coaches', 'Trainers.dc.html'],
      ['nutrition', 'Nutrition', 'Nutrition.dc.html'],
      ['results', 'Results', 'Transformations.dc.html'],
      ['pricing', 'Pricing', 'Pricing.dc.html'],
      ['press', 'Press', 'Press.dc.html']
    ];
    return {
      links: items.map(([key, label, href]) => ({ key, label, href, active: key === active, idle: key !== active }))
    };
  }
}
</script>
